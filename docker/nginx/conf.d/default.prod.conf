server {
    listen 80;
    server_name _;  # Catch-all for operator-selected public bindings

    # The entrypoint-generated map remains disabled unless a complete TLS
    # certificate pair is present and HTTP redirection is explicitly enabled.
    if ($redirect_to_https) {
        return 308 https://$host$request_uri;
    }

    # An empty value suppresses HSTS on HTTP, including Tor-only deployments.
    set $strict_transport_security "";
    include /etc/nginx/conf.d/snippets/transport-security.conf;
    include /etc/nginx/conf.d/snippets/application-routes.prod.conf;
}
