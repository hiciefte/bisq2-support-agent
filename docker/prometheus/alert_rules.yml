groups:
  - name: rag_alerts
    interval: 30s
    rules:
      # ========================================
      # Critical Alerts (Immediate Action)
      # ========================================

      - alert: RAGHighErrorRate
        expr: rag_error_rate > 0.05
        for: 5m
        labels:
          severity: critical
          component: rag
        annotations:
          summary: "RAG error rate above 5%"
          description: "Error rate is {{ $value | humanizePercentage }}. Immediate investigation required."
          runbook_url: "https://github.com/hiciefte/bisq2-support-agent/blob/main/docs/runbooks/rag-high-error-rate.md"

      - alert: RAGHighLatency
        expr: histogram_quantile(0.95, rate(rag_stage_latency_seconds_bucket[10m])) > 5
        for: 10m
        labels:
          severity: critical
          component: rag
        annotations:
          summary: "RAG P95 latency above 5 seconds"
          description: "Latency is {{ $value }}s. Users experiencing slow responses."
          runbook_url: "https://github.com/hiciefte/bisq2-support-agent/blob/main/docs/runbooks/rag-high-latency.md"

      - alert: ContainerDown
        expr: |
          absent(container_last_seen{container_label_com_docker_compose_service="api"})
          or absent(container_last_seen{container_label_com_docker_compose_service="web"})
          or absent(container_last_seen{container_label_com_docker_compose_service="bisq2-api"})
          or absent(container_last_seen{container_label_com_docker_compose_service="nginx"})
          or absent(container_last_seen{container_label_com_docker_compose_service="qdrant"})
          or absent(container_last_seen{container_label_com_docker_compose_service="scheduler"})
          or absent(container_last_seen{container_label_com_docker_compose_service="matrix-alert-relay"})
        for: 2m
        labels:
          severity: critical
          component: infrastructure
        annotations:
          summary: "Critical service {{ $labels.container_label_com_docker_compose_service }} is absent"
          description: "cAdvisor has reported no container for {{ $labels.container_label_com_docker_compose_service }} for 2 minutes. Service may be unavailable."

      - alert: ContainerUnhealthy
        expr: |
          (time() - max by (container_label_com_docker_compose_service) (
            max_over_time(container_last_seen{container_label_com_docker_compose_service=~"api|web|bisq2-api|nginx|qdrant|scheduler|matrix-alert-relay"}[10m])
          )) > 120
        for: 5m
        labels:
          severity: critical
          component: infrastructure
        annotations:
          summary: "Critical service {{ $labels.container_label_com_docker_compose_service }} telemetry is stale"
          description: "cAdvisor has not observed {{ $labels.container_label_com_docker_compose_service }} recently. Investigate its container state and health check."

      - alert: CriticalServiceProbeFailed
        expr: probe_success{job="critical-service-probes"} == 0
        for: 2m
        labels:
          severity: critical
          component: infrastructure
        annotations:
          summary: "Critical service {{ $labels.service }} failed its functional probe"
          description: "The internal functional probe for {{ $labels.service }} has failed for two minutes."
          runbook_url: "docs/runbooks/critical-service-health.md"

      - alert: CriticalServiceProbeMissing
        expr: |
          absent(probe_success{job="critical-service-probes",service="api"})
          or absent(probe_success{job="critical-service-probes",service="web"})
          or absent(probe_success{job="critical-service-probes",service="nginx"})
          or absent(probe_success{job="critical-service-probes",service="qdrant"})
          or absent(probe_success{job="critical-service-probes",service="bisq2-api"})
          or absent(probe_success{job="critical-service-probes",service="matrix-alert-relay"})
        for: 2m
        labels:
          severity: critical
          component: monitoring
        annotations:
          summary: "Critical service probe metrics are missing"
          description: "At least one required service probe series is absent. Check Prometheus and blackbox-exporter configuration."
          runbook_url: "docs/runbooks/critical-service-health.md"

      - alert: BlackboxExporterUnavailable
        expr: up{job="blackbox-exporter"} == 0 or absent(up{job="blackbox-exporter"})
        for: 2m
        labels:
          severity: critical
          component: monitoring
        annotations:
          summary: "Functional probe exporter is unavailable"
          description: "Prometheus cannot scrape the internal functional probe exporter."
          runbook_url: "docs/runbooks/critical-service-health.md"

      - alert: SchedulerHeartbeatStale
        expr: |
          absent(scheduler_heartbeat_timestamp_seconds)
          or scheduler_heartbeat_timestamp_seconds == 0
          or (time() - scheduler_heartbeat_timestamp_seconds) > 180
        for: 2m
        labels:
          severity: critical
          component: scheduler
        annotations:
          summary: "Scheduler execution heartbeat is stale or missing"
          description: "The scheduler has not exported a fresh cron heartbeat within three minutes."
          runbook_url: "docs/runbooks/scheduler-heartbeat.md"

  - name: data_quality_alerts
    interval: 1m
    rules:
      # ========================================
      # Warning Alerts (Review Within Hours)
      # ========================================

      - alert: WikiUpdateFailure
        expr: wiki_update_last_run_status == 0
        for: 1h
        labels:
          severity: warning
          component: wiki
        annotations:
          summary: "Wiki update failed"
          description: "Wiki synchronization process has failed. Documentation may be outdated."

      - alert: WikiUpdateStale
        expr: (time() - wiki_update_last_success_timestamp) > 691200  # 8 days
        for: 1d
        labels:
          severity: warning
          component: wiki
        annotations:
          summary: "Wiki update hasn't succeeded in 8 days"
          description: "Last successful update was {{ $value | humanizeDuration }} ago."

      - alert: LowUserSatisfaction
        expr: bisq_feedback_helpful_rate < 60
        for: 24h
        labels:
          severity: warning
          component: quality
        annotations:
          summary: "User satisfaction below 60%"
          description: "Current helpful-feedback rate: {{ $value }}%. Review recent feedback."

      - alert: HighRAGCost
        expr: avg(rag_cost_per_request_usd) > 0.02
        for: 1h
        labels:
          severity: warning
          component: rag
        annotations:
          summary: "RAG cost per request above $0.02"
          description: "Current average cost: ${{ $value }}. Consider optimizing token usage."

      - alert: BisqApiAuthFailures
        expr: increase(bisq2_api_auth_failures_total[10m]) > 0
        for: 5m
        labels:
          severity: warning
          component: bisq
        annotations:
          summary: "Bisq API authentication failures detected"
          description: "The support API recorded Bisq auth failures in the last 10 minutes. Check client credentials, session bootstrap, and pairing recovery."

      - alert: BisqExportReadinessFailed
        expr: bisq2_api_export_last_check_timestamp > 0 and bisq2_api_export_readiness_status == 0
        for: 5m
        labels:
          severity: warning
          component: bisq
        annotations:
          summary: "Bisq export readiness is failing"
          description: "Authenticated /api/v1/support/export checks are failing. FAQ extraction and support export are degraded."

      - alert: BisqMarketPricesReadinessFailed
        expr: bisq2_api_market_prices_last_check_timestamp > 0 and bisq2_api_market_prices_readiness_status == 0
        for: 5m
        labels:
          severity: warning
          component: bisq
        annotations:
          summary: "Bisq live market-price readiness is failing"
          description: "Live market price checks against the Bisq API are failing. Price lookups are degraded."

      - alert: BisqOfferbookReadinessFailed
        expr: bisq2_api_offerbook_last_check_timestamp > 0 and bisq2_api_offerbook_readiness_status == 0
        for: 5m
        labels:
          severity: warning
          component: bisq
        annotations:
          summary: "Bisq live offerbook readiness is failing"
          description: "Live offerbook checks against the Bisq API are failing. Offer availability lookups are degraded."

      - alert: BisqReadinessChecksStale
        expr: bisq2_api_last_check_timestamp > 0 and (time() - bisq2_api_last_check_timestamp) > 900
        for: 10m
        labels:
          severity: warning
          component: bisq
        annotations:
          summary: "Bisq readiness checks are stale"
          description: "No Bisq readiness probe has been recorded for more than 15 minutes. Check startup self-test execution and live-data probe paths."

  - name: training_sync_alerts
    interval: 30s
    rules:
      # ========================================
      # Training Sync Alerts
      # ========================================

      - alert: TrainingSyncFailed
        expr: training_sync_last_status == 0
        for: 5m
        labels:
          severity: warning
          component: training
        annotations:
          summary: "Training sync failed for {{ $labels.source }}"
          description: "The {{ $labels.source }} sync operation has failed. Q&A pairs may not be processed."

      - alert: TrainingSyncStale
        expr: (time() - training_sync_last_success_timestamp) > 90000  # 25 hours (tolerates one missed 12h cycle)
        for: 1h
        labels:
          severity: warning
          component: training
        annotations:
          summary: "Training sync stale for {{ $labels.source }} (>25h)"
          description: "Last successful sync for {{ $labels.source }} was {{ $value | humanizeDuration }} ago."

      - alert: TrainingQueueBacklog
        expr: sum(training_queue_size{routing="FULL_REVIEW"}) > 50
        for: 1h
        labels:
          severity: warning
          component: training
        annotations:
          summary: "Training review queue backlog: {{ $value }} items"
          description: "The FULL_REVIEW queue has {{ $value }} items pending. Consider reviewing and clearing the backlog."

  - name: privacy_retention_alerts
    interval: 30s
    rules:
      - alert: PrivacyRetentionWindowExceeded
        expr: max by (store) (privacy_retention_oldest_age_seconds) > on (store) max by (store) (privacy_retention_window_seconds)
        for: 15m
        labels:
          severity: critical
          component: privacy
        annotations:
          summary: "Privacy-retention window exceeded for {{ $labels.store }}"
          description: "The oldest retained local personal-data record is older than its configured window."
          runbook_url: "docs/runbooks/privacy-retention.md"

      - alert: PrivacyRetentionJobStaleOrMissing
        expr: absent(privacy_retention_last_success_timestamp_seconds{job="api"}) or (time() - max(privacy_retention_last_success_timestamp_seconds{job="api"})) > 90000
        for: 15m
        labels:
          severity: critical
          component: privacy
        annotations:
          summary: "Privacy-retention job is stale or missing"
          description: "No successful privacy-retention run has been observed within the daily schedule allowance."
          runbook_url: "docs/runbooks/privacy-retention.md"

      - alert: PrivacyRetentionLogJobStaleOrMissing
        expr: absent(privacy_retention_log_last_success_timestamp_seconds{job="node-exporter"}) or (time() - max(privacy_retention_log_last_success_timestamp_seconds{job="node-exporter"})) > 90000
        for: 15m
        labels:
          severity: critical
          component: privacy
        annotations:
          summary: "Bind-mounted log-retention job is stale or missing"
          description: "No successful bind-mounted log-retention run has been observed within the daily schedule allowance."
          runbook_url: "docs/runbooks/privacy-retention.md"

      - alert: MatrixAlertRelayRetentionStaleOrMissing
        expr: absent(privacy_retention_last_success_timestamp_seconds{job="matrix-alert-relay"}) or (time() - max(privacy_retention_last_success_timestamp_seconds{job="matrix-alert-relay"})) > 7500
        for: 15m
        labels:
          severity: critical
          component: privacy
        annotations:
          summary: "Matrix alert-relay retention metrics are stale or missing"
          description: "The isolated Matrix alert relay has not reported a successful session-retention check within its hourly schedule allowance."
          runbook_url: "docs/runbooks/privacy-retention.md"

      - alert: PrivacyRetentionFailures
        expr: increase(privacy_retention_failures_total[1h]) > 0
        for: 5m
        labels:
          severity: critical
          component: privacy
        annotations:
          summary: "Privacy-retention job failed"
          description: "At least one local personal-data store failed retention processing."
          runbook_url: "docs/runbooks/privacy-retention.md"

  - name: operator_security_alerts
    interval: 30s
    rules:
      - alert: ChatOpsDispatchErrors
        expr: sum(increase(chatops_dispatch_total{result="error"}[10m])) > 0
        for: 10m
        labels:
          severity: warning
          component: chatops
        annotations:
          summary: "ChatOps dispatch errors detected"
          description: "One or more ChatOps commands have failed for at least 10 minutes. Review /admin/security/alerts and the ChatOps audit trail."

      - alert: ChatOpsUnauthorizedSpike
        expr: sum(increase(chatops_auth_total{result="rejected"}[10m])) > 20
        for: 10m
        labels:
          severity: warning
          component: chatops
        annotations:
          summary: "ChatOps authorization rejections spiking"
          description: "More than 20 ChatOps commands were rejected in 10 minutes. Check staff-room permissions, command misuse, or abuse."

      - alert: ChatOpsHighLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(chatops_dispatch_latency_seconds_bucket[10m]))) > 2
        for: 10m
        labels:
          severity: warning
          component: chatops
        annotations:
          summary: "ChatOps dispatch latency is elevated"
          description: "P95 ChatOps dispatch latency has stayed above 2 seconds for 10 minutes. Check escalation lookups and downstream channel delivery."

      - alert: TrustMonitorFindingSpike
        expr: sum(increase(trust_monitor_findings_total{action="created"}[15m])) > 10
        for: 10m
        labels:
          severity: warning
          component: trust_monitor
        annotations:
          summary: "Trust-monitor findings are spiking"
          description: "More than 10 new trust-monitor findings were created in 15 minutes. Review possible coordinated abuse or detector drift."

      - alert: TrustMonitorFalsePositiveSpike
        expr: sum(increase(trust_monitor_feedback_total{action="false_positive"}[30m])) > 5
        for: 10m
        labels:
          severity: warning
          component: trust_monitor
        annotations:
          summary: "Trust-monitor false positives are spiking"
          description: "Support staff marked more than 5 findings as false positive in 30 minutes. Review detector thresholds before enabling broader alerting."

  - name: container_resource_alerts
    interval: 30s
    rules:
      # ========================================
      # Container Resource Alerts (cAdvisor)
      # ========================================

      - alert: ContainerHighMemory
        expr: avg_over_time((container_memory_usage_bytes{name=~"docker-.*"} / container_spec_memory_limit_bytes{name=~"docker-.*"})[15m:30s]) > 0.90 and container_spec_memory_limit_bytes{name=~"docker-.*"} > 0 and (time() - container_last_seen{name=~"docker-.*"}) < 60
        for: 10m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "Container {{ $labels.name }} memory usage >90% (15m avg)"
          description: "Container {{ $labels.name }} averaged {{ $value | humanizePercentage }} memory usage over the last 15 minutes."

      - alert: ContainerHighCPU
        expr: (rate(container_cpu_usage_seconds_total{name=~"docker-.*",cpu="total"}[5m]) / on(name, instance, id) clamp_min((container_spec_cpu_quota{name=~"docker-.*"} / container_spec_cpu_period{name=~"docker-.*"}), 0.001)) > 0.90 and on(name, instance, id) container_spec_cpu_quota{name=~"docker-.*"} > 0 and on(name, instance, id) (time() - container_last_seen{name=~"docker-.*"}) < 60
        for: 15m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "Container {{ $labels.name }} CPU usage >90% of limit"
          description: "Container {{ $labels.name }} has sustained high CPU usage relative to its CPU quota."

      - alert: ContainerCPUThrottlingHigh
        expr: (rate(container_cpu_cfs_throttled_periods_total{name=~"docker-.*"}[5m]) / clamp_min(rate(container_cpu_cfs_periods_total{name=~"docker-.*"}[5m]), 1)) > 0.25 and container_spec_cpu_quota{name=~"docker-.*"} > 0 and (time() - container_last_seen{name=~"docker-.*"}) < 60
        for: 10m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "Container {{ $labels.name }} CPU throttling >25%"
          description: "Container {{ $labels.name }} is frequently throttled and may be CPU-starved."
