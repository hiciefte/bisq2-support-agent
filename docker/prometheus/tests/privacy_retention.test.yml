- name: seven missing groups produce one alert with truthful count
  interval: 1m
  input_series: []
  alert_rule_test:
  - eval_time: 20m
    alertname: PrivacyRetentionMetricsMissing
    exp_alerts:
    - exp_labels:
        severity: critical
        component: privacy
      exp_annotations:
        summary: Privacy-retention metrics are missing
        description: 7 required store-group success or per-store age/window metric
          groups are absent or incomplete.
        runbook_url: docs/runbooks/privacy-retention.md
