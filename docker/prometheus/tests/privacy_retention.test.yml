# Checked with promtool test rules; these samples never contact services.
rule_files:
- ../alert_rules.yml
evaluation_interval: 30s
tests:
- name: complete fresh hold suppresses missing metrics without claiming success
  interval: 1m
  input_series:
  - &id001
    series: up{job="node-exporter",instance="node-exporter:9100"}
    values: 1+0x40
  - &id002
    series: scheduler_retention_hold_active{job="node-exporter",instance="node-exporter:9100"}
    values: 1+0x40
  - &id003
    series: scheduler_heartbeat_timestamp_seconds{job="node-exporter",instance="node-exporter:9100"}
    values: 0+60x40
  - &id004
    series: scheduler_retention_hold_observed_timestamp_seconds{job="node-exporter",instance="node-exporter:9100"}
    values: 0+60x40
  - &id005
    series: scheduler_retention_hold_cutoff_timestamp_seconds{job="node-exporter",instance="node-exporter:9100"}
    values: 1000+0x40
  - series: scheduler_retention_hold_invalid{job="node-exporter",instance="node-exporter:9100"}
    values: 0+0x40
  promql_expr_test:
  - expr: count(privacy_retention:verified_scheduler_hold) or vector(0)
    eval_time: 20m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: count(ALERTS{alertname="PrivacyRetentionMetricsMissing",alertstate="firing"})
      or vector(0)
    eval_time: 20m
    exp_samples:
    - labels: '{}'
      value: 0
  - expr: count(ALERTS{alertname="PrivacyRetentionHeld",alertstate="firing",severity="warning"})
      or vector(0)
    eval_time: 20m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: count(privacy_retention_last_success_timestamp_seconds) or vector(0)
    eval_time: 20m
    exp_samples:
    - labels: '{}'
      value: 0
  - expr: count(ALERTS{alertname="PrivacyRetentionLogMetricsMissing",alertstate="firing"})
      or vector(0)
    eval_time: 20m
    exp_samples:
    - labels: '{}'
      value: 0
