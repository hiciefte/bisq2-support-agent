global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

# Load alert rules
rule_files:
  - '/etc/prometheus/alert_rules.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'

  - job_name: 'matrix-alert-relay'
    static_configs:
      - targets: ['matrix-alert-relay:8000']
    metrics_path: '/metrics'

  - job_name: 'blackbox-exporter'
    static_configs:
      - targets: ['blackbox-exporter:9115']

  - job_name: 'critical-service-probes'
    metrics_path: '/probe'
    params:
      module: ['http_2xx']
    static_configs:
      - targets: ['http://api:8000/health/ready']
        labels:
          service: 'api'
      - targets: ['http://web:3000/']
        labels:
          service: 'web'
      - targets: ['http://nginx:80/health']
        labels:
          service: 'nginx'
      - targets: ['http://qdrant:6333/readyz']
        labels:
          service: 'qdrant'
      - targets: ['http://bisq2-api:8090/api/v1/openapi.json']
        labels:
          service: 'bisq2-api'
      - targets: ['http://matrix-alert-relay:8000/ready']
        labels:
          service: 'matrix-alert-relay'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 'blackbox-exporter:9115'

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 15s

  # Tor-specific monitoring job
  # This job scrapes metrics specific to Tor hidden service health
  # Uncomment and configure when deploying with Tor
  # - job_name: 'tor_onion_service'
  #   static_configs:
  #     - targets: ['your-address.onion']
  #   proxy_url: 'socks5://host.docker.internal:9050'  # Use host Tor SOCKS proxy
  #   # For Linux Docker Engine:
  #   # proxy_url: 'socks5://172.17.0.1:9050'
  #   scrape_interval: 30s
  #   scrape_timeout: 10s
  #   metrics_path: '/metrics'
