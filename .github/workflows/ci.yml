name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  lint-and-test:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          # Remove pre-installed software to free up space for Python packages
          # PyTorch + CUDA libraries require significant disk space
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.11'

      - name: Install pip-tools
        run: |
          python -m pip install pip==25.0 pip-tools==7.5.1

      - name: Check if requirements.txt is up to date
        run: |
          pip-compile api/requirements.in -o api/requirements.txt --no-strip-extras
          echo "git diff of requirements.txt:"
          git diff --no-color api/requirements.txt
          git diff --exit-code --quiet api/requirements.txt || (echo "ERROR: requirements.txt is not up to date. Please run 'pip-compile api/requirements.in -o api/requirements.txt --no-strip-extras' and commit the changes." && exit 1)

      - name: Install CPU-only PyTorch
        run: |
          pip install --no-cache-dir \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            "torch==2.10.0+cpu"

      - name: Install dependencies
        run: pip-sync api/requirements.txt --pip-args "--no-cache-dir"

      - name: Check formatting with black
        run: black --check api/

      - name: Check import sorting with isort
        run: isort --check-only --profile black api/

      - name: Type check with mypy
        run: |
          cd api
          mypy app/ --ignore-missing-imports --no-strict-optional --warn-redundant-casts --warn-unused-ignores --explicit-package-bases || echo "Mypy found type issues - these should be fixed in a future PR"

      - name: Lint with flake8
        run: |
          cd api
          flake8 app/ tests/ --max-line-length=88 --extend-ignore=E203,W503,E501 --exclude=venv,__pycache__,.git,data

      - name: Run tests with pytest
        run: |
          cd api
          pytest tests/ -v --tb=short

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Hadolint on API Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/api/Dockerfile

      - name: Run Hadolint on Web Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/web/Dockerfile

      - name: Run Trivy vulnerability scanner on api image
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          image-ref: '.'
          scan-ref: './api'
          format: 'table'
          trivy-config: '.trivy.yaml'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy vulnerability scanner on web image
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          image-ref: '.'
          scan-ref: './web'
          format: 'table'
          trivy-config: '.trivy.yaml'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  rag-eval-gate:
    name: RAG Golden-Set Gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: openai:gpt-4o-mini
      OPENAI_EMBEDDING_MODEL: text-embedding-3-small
      RETRIEVER_BACKEND: qdrant
      ENABLE_COLBERT_RERANK: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Require OpenAI API key for quality gate
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY secret is required for the RAG quality gate."
            exit 1
          fi

      - name: Start API and Qdrant
        run: |
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.local.yml up -d --build api qdrant

      - name: Run locked retrieval benchmark
        run: |
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.local.yml exec -T api \
            python -m app.scripts.retrieval_benchmark_harness run \
              --lock-file /data/evaluation/retrieval_strict.lock.json

      - name: Enforce answer quality floors
        run: |
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.local.yml exec -T api \
            python -m app.scripts.retrieval_benchmark_harness gate \
              --summary /data/evaluation/benchmarks/qdrant_strict.summary.json \
              --min-recall-at-k 0.38 \
              --min-mrr 0.60 \
              --min-faithfulness 0.40 \
              --min-answer-relevancy 0.55

      - name: Dump service logs on failure
        if: failure()
        run: |
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.local.yml logs --tail=300 api qdrant

      - name: Stop services
        if: always()
        run: |
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.local.yml down -v
