name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  schedule:
    - cron: "17 3 * * *"

jobs:
  lint-and-test:
    name: Lint, Type Check & Test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          # Remove pre-installed software to free up space for Python packages
          # PyTorch + CUDA libraries require significant disk space
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.11'

      - name: Install pip-tools
        run: |
          python -m pip install pip==25.0 pip-tools==7.5.1

      - name: Check if requirements.txt is up to date
        run: |
          pip-compile api/requirements.in -o api/requirements.txt --no-strip-extras
          echo "git diff of requirements.txt:"
          git diff --no-color api/requirements.txt
          git diff --exit-code --quiet api/requirements.txt || (echo "ERROR: requirements.txt is not up to date. Please run 'pip-compile api/requirements.in -o api/requirements.txt --no-strip-extras' and commit the changes." && exit 1)

      - name: Install CPU-only PyTorch
        run: |
          pip install --no-cache-dir \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            "torch==2.10.0+cpu"

      - name: Install dependencies
        run: pip-sync api/requirements.txt --pip-args "--no-cache-dir"

      - name: Check formatting with black
        run: black --check api/

      - name: Check import sorting with isort
        run: isort --check-only --profile black api/

      - name: Type check with mypy
        run: |
          cd api
          mypy app/ --ignore-missing-imports --no-strict-optional --warn-redundant-casts --warn-unused-ignores --explicit-package-bases

      - name: Lint with flake8
        run: |
          cd api
          flake8 app/ tests/ --max-line-length=88 --extend-ignore=E203,W503,E501 --exclude=venv,__pycache__,.git,data

      - name: Run tests with pytest
        run: |
          cd api
          pytest tests/ -v --tb=short

  frontend:
    name: Frontend Lint, Type Check & Test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run Jest tests
        run: npm test -- --runInBand

  shell-validation:
    name: Shell Lint & Deployment Tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Lint shell scripts
        run: >-
          shellcheck scripts/*.sh scripts/lib/*.sh scripts/tests/*.sh
          docker/scripts/scheduler-heartbeat.sh

      - name: Test environment configuration helpers
        run: bash scripts/tests/test_env_config.sh

      - name: Validate monitoring configuration
        run: bash scripts/validate-monitoring-config.sh

  security:
    name: Security Scan
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Hadolint on API Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/api/Dockerfile

      - name: Run Hadolint on Web Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/web/Dockerfile

      - name: Run Trivy vulnerability scanner on api image
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          image-ref: '.'
          scan-ref: './api'
          format: 'table'
          trivy-config: '.trivy.yaml'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy vulnerability scanner on web image
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          image-ref: '.'
          scan-ref: './web'
          format: 'table'
          trivy-config: '.trivy.yaml'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  staff-alignment-offline:
    name: Offline Staff-Alignment Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.11'

      - name: Score precomputed staff-alignment fixture
        run: |
          PYTHONPATH=api python -m app.scripts.retrieval_benchmark_harness behavior \
            --input api/tests/fixtures/staff_alignment_behavior.json \
            --output /tmp/staff_alignment_behavior.summary.json
